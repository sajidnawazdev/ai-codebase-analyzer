apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-service
spec:
  replicas: {{ .Values.reportService.replicas }}
  selector:
    matchLabels:
      app: report-service
  template:
    metadata:
      labels:
        app: report-service
    spec:
      containers:
        - name: report-service
          image: {{ .Values.reportService.image.repository }}:{{ .Values.reportService.image.tag }}
          imagePullPolicy: {{ .Values.reportService.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: 8081
          resources:
            requests:
              memory: "256Mi"
            limits:
              memory: "512Mi"
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx384m"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://{{ .Release.Name }}-postgresql:5432/{{ .Values.postgresql.auth.database }}
            - name: SPRING_DATASOURCE_USERNAME
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: SPRING_DATASOURCE_PASSWORD
              value: {{ .Values.postgresql.auth.password | quote }}
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.reportService.kafka.bootstrapServers | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: report-service
spec:
  selector:
    app: report-service
  ports:
    - port: 8081
      targetPort: 8081
