apiVersion: v1
kind: Secret
metadata:
  name: analyzer-secret
type: Opaque
stringData:
  OPENAI_API_KEY: {{ .Values.analyzer.openaiApiKey | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analyzer
spec:
  replicas: {{ .Values.analyzer.replicas }}
  selector:
    matchLabels:
      app: analyzer
  template:
    metadata:
      labels:
        app: analyzer
    spec:
      containers:
        - name: analyzer
          image: {{ .Values.analyzer.image.repository }}:{{ .Values.analyzer.image.tag }}
          imagePullPolicy: {{ .Values.analyzer.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "256Mi"
            limits:
              memory: "512Mi"
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx384m"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: analyzer-secret
                  key: OPENAI_API_KEY
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.analyzer.kafka.bootstrapServers | quote }}
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.analyzer.profile | quote }}
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              value: {{ .Values.analyzer.keycloak.issuerUri | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: analyzer
spec:
  type: {{ .Values.analyzer.service.type }}
  selector:
    app: analyzer
  ports:
    - port: 8080
      targetPort: 8080
