<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codebase Analyzer</title>
<script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
<style>
  :root {
    --bg: #f8f9fa;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-secondary: #555770;
    --border: #e0e0e6;
    --accent: #4361ee;
    --accent-light: #eef0ff;
    --green: #10b981;
    --yellow: #f59e0b;
    --red: #ef4444;
    --orange: #f97316;
    --radius: 10px;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-lg: 0 4px 12px rgba(0,0,0,0.08);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1117;
      --surface: #1a1b26;
      --text: #e2e4f0;
      --text-secondary: #9a9bb4;
      --border: #2a2b3d;
      --accent: #6c8aff;
      --accent-light: #1e2240;
      --shadow: 0 1px 3px rgba(0,0,0,0.3);
      --shadow-lg: 0 4px 12px rgba(0,0,0,0.4);
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }

  .container { max-width: 1100px; margin: 0 auto; padding: 40px 24px; }

  h1 {
    font-size: 1.75rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  h1 span { color: var(--accent); }

  .header {
    text-align: center;
    margin-bottom: 32px;
  }

  .header p {
    color: var(--text-secondary);
    margin-top: 6px;
    font-size: 0.95rem;
  }

  /* Input bar */
  .input-bar {
    display: flex;
    gap: 10px;
    background: var(--surface);
    padding: 8px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    margin-bottom: 32px;
  }

  .input-bar input {
    flex: 1;
    border: none;
    background: transparent;
    padding: 10px 14px;
    font-size: 0.95rem;
    color: var(--text);
    outline: none;
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
  }

  .input-bar input::placeholder { color: var(--text-secondary); opacity: 0.6; }

  .btn {
    padding: 10px 28px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 7px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
    white-space: nowrap;
  }

  .btn:hover { opacity: 0.88; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Loading */
  .loading {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 60px 0;
  }

  .loading.active { display: flex; }

  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading p { color: var(--text-secondary); font-size: 0.95rem; }

  /* Error */
  .error-msg {
    display: none;
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #991b1b;
    padding: 14px 18px;
    border-radius: var(--radius);
    margin-bottom: 24px;
    font-size: 0.9rem;
  }

  @media (prefers-color-scheme: dark) {
    .error-msg { background: #2d1b1b; border-color: #5c2020; color: #fca5a5; }
  }

  /* Report */
  #report { display: none; }
  #report.active { display: block; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
  }

  .card h2 {
    font-size: 1rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-secondary);
    margin-bottom: 16px;
  }

  /* Score circle */
  .score-hero {
    display: flex;
    align-items: center;
    gap: 32px;
    flex-wrap: wrap;
  }

  .score-circle {
    position: relative;
    width: 120px;
    height: 120px;
    flex-shrink: 0;
  }

  .score-circle svg { transform: rotate(-90deg); }

  .score-circle-bg {
    fill: none;
    stroke: var(--border);
    stroke-width: 8;
  }

  .score-circle-fg {
    fill: none;
    stroke-width: 8;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.8s ease;
  }

  .score-number {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    font-weight: 700;
  }

  .score-number span { font-size: 1rem; font-weight: 400; color: var(--text-secondary); }

  .assessment-text {
    flex: 1;
    min-width: 240px;
    font-size: 1.05rem;
    line-height: 1.7;
    color: var(--text);
  }

  /* Category scores */
  .category-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
  }

  .category-item {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .category-label {
    font-size: 0.85rem;
    color: var(--text-secondary);
    text-transform: capitalize;
  }

  .category-bar-track {
    height: 8px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
  }

  .category-bar-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.6s ease;
  }

  .category-value {
    font-size: 0.8rem;
    font-weight: 600;
  }

  /* Lists */
  .item-list { list-style: none; }

  .item-list li {
    padding: 10px 14px;
    border-radius: 7px;
    margin-bottom: 6px;
    font-size: 0.9rem;
    line-height: 1.5;
  }

  .item-list.strengths li { background: #ecfdf5; color: #065f46; }
  .item-list.issues li { background: #fef2f2; color: #991b1b; }
  .item-list.improvements li { background: #fffbeb; color: #92400e; }
  .item-list.neutral li { background: var(--accent-light); color: var(--text); }

  @media (prefers-color-scheme: dark) {
    .item-list.strengths li { background: #0d2818; color: #6ee7b7; }
    .item-list.issues li { background: #2d1b1b; color: #fca5a5; }
    .item-list.improvements li { background: #2d2410; color: #fcd34d; }
    .item-list.neutral li { background: var(--accent-light); color: var(--text); }
  }

  /* Violation sections */
  .violation-section { margin-bottom: 14px; }

  .violation-section h3 {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 8px;
  }

  .violation-section li {
    background: var(--accent-light);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 7px;
    margin-bottom: 4px;
    font-size: 0.88rem;
  }

  .empty-state {
    color: var(--text-secondary);
    font-size: 0.88rem;
    font-style: italic;
  }

  /* Summary stats */
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 12px;
  }

  .summary-stat {
    text-align: center;
    padding: 14px 8px;
    background: var(--accent-light);
    border-radius: 8px;
  }

  .summary-stat .num {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--accent);
  }

  .summary-stat .label {
    font-size: 0.78rem;
    color: var(--text-secondary);
    margin-top: 2px;
  }

  /* Endpoints table */
  .data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.88rem;
  }

  .data-table th {
    text-align: left;
    padding: 10px 12px;
    border-bottom: 2px solid var(--border);
    font-weight: 600;
    color: var(--text-secondary);
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .data-table td {
    padding: 9px 12px;
    border-bottom: 1px solid var(--border);
  }

  .method-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 0.75rem;
    font-weight: 700;
    font-family: monospace;
  }

  .method-GET { background: #dbeafe; color: #1d4ed8; }
  .method-POST { background: #dcfce7; color: #166534; }
  .method-PUT { background: #fef3c7; color: #92400e; }
  .method-DELETE { background: #fee2e2; color: #991b1b; }
  .method-PATCH { background: #f3e8ff; color: #6b21a8; }

  @media (prefers-color-scheme: dark) {
    .method-GET { background: #1e3a5f; color: #93c5fd; }
    .method-POST { background: #14532d; color: #86efac; }
    .method-PUT { background: #422006; color: #fde68a; }
    .method-DELETE { background: #450a0a; color: #fca5a5; }
    .method-PATCH { background: #3b0764; color: #d8b4fe; }
  }

  .mono { font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; font-size: 0.85rem; }

  /* Packages */
  .package-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    gap: 12px;
  }

  .package-item:last-child { border-bottom: none; }

  .package-name { font-family: monospace; font-size: 0.88rem; flex: 1; min-width: 0; word-break: break-all; }

  .package-badges { display: flex; gap: 6px; flex-wrap: wrap; flex-shrink: 0; }

  .badge {
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 0.75rem;
    font-weight: 600;
    background: var(--accent-light);
    color: var(--accent);
    white-space: nowrap;
  }

  /* Mermaid diagram */
  .mermaid-container {
    overflow-x: auto;
    padding: 16px 0;
  }

  .mermaid-container svg { max-width: 100%; height: auto; }

  /* Coupling */
  .coupling-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
  }

  .coupling-item:last-child { border-bottom: none; }

  .coupling-rank {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.8rem;
    flex-shrink: 0;
  }

  .coupling-text { font-size: 0.9rem; }

  .muted {
    color: var(--text-secondary);
    font-size: 0.86rem;
  }

  /* Evidence-based findings */
  .finding-list {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .finding {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 18px;
    background: color-mix(in srgb, var(--surface) 88%, var(--accent-light));
  }

  .finding-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 14px;
  }

  .finding-title {
    font-size: 1rem;
    font-weight: 700;
    color: var(--text);
  }

  .finding-meta {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .finding-pill {
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    background: var(--accent-light);
    color: var(--accent);
    white-space: nowrap;
  }

  .finding-pill.severity-CRITICAL,
  .finding-pill.severity-HIGH { background: #fee2e2; color: #991b1b; }
  .finding-pill.severity-MEDIUM { background: #ffedd5; color: #9a3412; }
  .finding-pill.severity-LOW,
  .finding-pill.severity-INFO { background: #ecfdf5; color: #065f46; }

  @media (prefers-color-scheme: dark) {
    .finding-pill.severity-CRITICAL,
    .finding-pill.severity-HIGH { background: #450a0a; color: #fca5a5; }
    .finding-pill.severity-MEDIUM { background: #431407; color: #fdba74; }
    .finding-pill.severity-LOW,
    .finding-pill.severity-INFO { background: #052e16; color: #86efac; }
  }

  .finding-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    margin-bottom: 14px;
  }

  .finding-block h3 {
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 8px;
  }

  .finding-block ul {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .finding-block li {
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    font-size: 0.82rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 9px;
    word-break: break-word;
  }

  .finding-text {
    display: grid;
    gap: 12px;
  }

  .finding-text p {
    font-size: 0.9rem;
    color: var(--text);
  }

  .legacy-observations {
    margin-top: 12px;
  }

  .legacy-observations summary {
    cursor: pointer;
    color: var(--text-secondary);
    font-size: 0.88rem;
    font-weight: 600;
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Codebase <span>Analyzer</span></h1>
    <p>Architecture analysis powered by AI</p>
  </div>

  <div class="input-bar">
    <input type="text" id="projectInput" placeholder="Local path or Git URL, e.g. https://github.com/user/repo.git">
    <button class="btn" id="analyzeBtn" onclick="analyze()">Analyze</button>
  </div>

  <div class="error-msg" id="errorMsg"></div>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p id="loadingText">Scanning project and running AI analysis...</p>
  </div>

  <div id="report"></div>
</div>

<script>
  mermaid.initialize({ startOnLoad: false, theme: window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'default' });

  const $ = id => document.getElementById(id);

  function isGitUrl(input) {
    return input.startsWith('https://') || input.startsWith('http://') || input.startsWith('git@') || input.endsWith('.git');
  }

  async function analyze() {
    const input = $('projectInput').value.trim();
    if (!input) return;

    $('errorMsg').style.display = 'none';
    $('report').className = '';
    $('report').innerHTML = '';
    $('loading').classList.add('active');
    $('analyzeBtn').disabled = true;

    const isRepo = isGitUrl(input);
    const param = isRepo
      ? 'repoUrl=' + encodeURIComponent(input)
      : 'projectPath=' + encodeURIComponent(input);
    $('loadingText').textContent = isRepo
      ? 'Cloning repository, scanning, and running AI analysis...'
      : 'Scanning project and running AI analysis...';

    try {
      const res = await fetch('/analyse/ai?' + param, { method: 'POST' });
      if (!res.ok) {
        const text = await res.text();
        throw new Error(text || ('HTTP ' + res.status));
      }
      const data = await res.json();
      $('loading').classList.remove('active');
      renderReport(data);
    } catch (e) {
      $('loading').classList.remove('active');
      $('errorMsg').textContent = 'Analysis failed: ' + e.message;
      $('errorMsg').style.display = 'block';
    } finally {
      $('analyzeBtn').disabled = false;
    }
  }

  $('projectInput').addEventListener('keydown', e => { if (e.key === 'Enter') analyze(); });

  function scoreColor(score) {
    if (score >= 8) return 'var(--green)';
    if (score >= 6) return 'var(--yellow)';
    if (score >= 4) return 'var(--orange)';
    return 'var(--red)';
  }

  function renderList(items, cls) {
    if (!items || items.length === 0) return '<p class="empty-state">None detected.</p>';
    return '<ul class="item-list ' + cls + '">' + items.map(i => '<li>' + esc(i) + '</li>').join('') + '</ul>';
  }

  function renderInlineList(items) {
    if (!items || items.length === 0) return '<p class="empty-state">None.</p>';
    return '<ul>' + items.map(i => '<li>' + esc(i) + '</li>').join('') + '</ul>';
  }

  function renderFindings(findings) {
    if (!findings || findings.length === 0) {
      return '<p class="empty-state">No evidence-based findings.</p>';
    }

    let html = '<div class="finding-list">';
    findings.forEach((finding, index) => {
      const severity = finding.severity || 'INFO';
      const confidence = finding.confidence || 'POSSIBLE';
      const category = finding.category || 'DESIGN';
      const priority = getPriorityScore(finding);
      html += '<article class="finding">';
      html += '<div class="finding-header">';
      html += '<div class="finding-title">' + (index + 1) + '. ' + esc(finding.title || 'Finding') + '</div>';
      html += '<div class="finding-meta">';
      html += '<span class="finding-pill">Priority: ' + priority + '</span>';
      html += '<span class="finding-pill">Category: ' + esc(category) + '</span>';
      html += '<span class="finding-pill severity-' + esc(severity) + '">Severity: ' + esc(severity) + '</span>';
      html += '<span class="finding-pill">Confidence: ' + esc(confidence) + '</span>';
      html += '</div></div>';
      html += '<div class="finding-grid">';
      html += '<div class="finding-block"><h3>Affected Classes</h3>' + renderInlineList(finding.affectedClasses) + '</div>';
      html += '<div class="finding-block"><h3>Evidence</h3>' + renderInlineList(finding.evidence) + '</div>';
      html += '</div>';
      html += '<div class="finding-text">';
      html += '<div class="finding-block"><h3>Impact</h3><p>' + esc(finding.impact || '') + '</p></div>';
      html += renderFindingImpact(finding.findingImpact);
      html += '<div class="finding-block"><h3>Recommendation</h3><p>' + esc(finding.recommendation || '') + '</p></div>';
      html += '</div>';
      html += '</article>';
    });
    html += '</div>';
    return html;
  }

  function renderFindingsByCategory(findings) {
    if (!findings || findings.length === 0) {
      return '<p class="empty-state">No evidence-based findings.</p>';
    }

    const groups = {};
    sortedFindings(findings).forEach(finding => {
      const category = finding.category || 'DESIGN';
      if (!groups[category]) groups[category] = [];
      groups[category].push(finding);
    });

    return Object.entries(groups)
      .map(([category, categoryFindings]) =>
        '<div class="violation-section"><h3>' + esc(toTitle(category)) + ' Findings</h3>' +
        renderFindings(categoryFindings) + '</div>')
      .join('');
  }

  function renderFindingImpact(impact) {
    if (!impact) return '';
    let html = '<div class="finding-block"><h3>Consequence</h3>';
    html += '<p><strong>Short-term:</strong> ' + esc(impact.shortTermImpact || '') + '</p>';
    html += '<p><strong>Long-term:</strong> ' + esc(impact.longTermImpact || '') + '</p>';
    html += '<p><strong>Growth risk:</strong> ' + esc(impact.growthRisk || 'LOW') + '</p>';
    html += '</div>';
    return html;
  }

  function renderTopFindings(findings) {
    const top = sortedFindings(findings).slice(0, 5);
    if (top.length === 0) return '<p class="empty-state">No prioritized findings.</p>';

    let html = '';
    top.forEach((finding, index) => {
      html += '<div class="coupling-item">';
      html += '<div class="coupling-rank">' + (index + 1) + '</div>';
      html += '<div class="coupling-text"><strong>' + esc(finding.title || 'Finding') + '</strong><br>';
      html += 'Priority: ' + getPriorityScore(finding);
      if (finding.evidence && finding.evidence.length > 0) {
        html += '<br><span class="muted">' + esc(finding.evidence[0]) + '</span>';
      }
      html += '</div></div>';
    });
    return html;
  }

  function renderRecommendedRefactorings(findings, fallbackItems) {
    const recommendations = sortedFindings(findings)
      .filter(finding => finding.recommendation)
      .map(finding => ({ priority: getPriorityScore(finding), text: finding.recommendation }));

    if (recommendations.length === 0) {
      return renderList(fallbackItems, 'improvements');
    }

    let html = '<ul class="item-list improvements">';
    recommendations.forEach(item => {
      html += '<li><strong>Priority ' + item.priority + '</strong><br>' + esc(item.text) + '</li>';
    });
    html += '</ul>';
    return html;
  }

  function renderExecutiveSummary(raw, architecturalFindings) {
    const style = raw && raw.architectureStyleAssessment ? raw.architectureStyleAssessment.primary : (raw && raw.architectureStyle) || 'UNKNOWN';
    const maturity = (raw && raw.architectureMaturity) || 'UNKNOWN';
    const topRisks = sortedRiskAreas(raw && raw.riskAreas).slice(0, 3);
    const topFinding = sortedFindings(architecturalFindings)[0];

    let html = '<div class="finding-text">';
    html += '<p><strong>Architecture style:</strong> ' + esc(style) + '</p>';
    html += '<p><strong>Architecture maturity:</strong> ' + esc(maturity) + '</p>';
    if (topRisks.length > 0) {
      html += '<p><strong>Top risk areas:</strong> ' + esc(topRisks.map(area => area.name + ' ' + area.level).join(', ')) + '</p>';
    }
    if (topFinding) {
      html += '<p><strong>Highest priority finding:</strong> ' + esc(topFinding.title) + ' (Priority ' + getPriorityScore(topFinding) + ')</p>';
    }
    html += '<p>' + esc(executiveSummaryText(style, topRisks, topFinding)) + '</p>';
    html += '</div>';
    return html;
  }

  function executiveSummaryText(style, topRisks, topFinding) {
    if (style === 'SIMPLE_CRUD') {
      return 'The project appears to follow a simple CRUD architecture. Recommendations should focus on growth-sensitive risks rather than large architectural refactors.';
    }
    if (topRisks && topRisks.length > 0) {
      return 'The main architectural risks are concentrated in the listed risk areas. Review the highest priority findings before lower-level analyzer evidence.';
    }
    if (topFinding) {
      return 'The report found a small number of prioritized architectural concerns. Start with the highest priority finding.';
    }
    return 'No significant architectural risk areas were detected from the current static analysis signals.';
  }

  function renderArchitectureStyle(raw) {
    const assessment = raw && raw.architectureStyleAssessment;
    const primary = assessment ? assessment.primary : ((raw && raw.architectureStyle) || 'UNKNOWN');
    const confidence = assessment ? assessment.confidence : 'POSSIBLE';
    const reasoning = assessment ? assessment.reasoning : [];

    let html = '<div class="finding">';
    html += '<div class="finding-header">';
    html += '<div class="finding-title">Primary: ' + esc(primary) + '</div>';
    html += '<div class="finding-meta"><span class="finding-pill">Confidence: ' + esc(confidence) + '</span>';
    html += '<span class="finding-pill">Maturity: ' + esc((raw && raw.architectureMaturity) || 'UNKNOWN') + '</span></div>';
    html += '</div>';
    html += '<div class="finding-block"><h3>Reasoning</h3>' + renderInlineList(reasoning) + '</div>';
    html += '</div>';
    return html;
  }

  function renderRiskAreas(riskAreas) {
    if (!riskAreas || riskAreas.length === 0) {
      return '<p class="empty-state">No risk areas available.</p>';
    }

    let html = '<div class="finding-list">';
    sortedRiskAreas(riskAreas).forEach(area => {
      html += '<article class="finding">';
      html += '<div class="finding-header">';
      html += '<div class="finding-title">' + esc(area.name) + ' Risk</div>';
      html += '<div class="finding-meta"><span class="finding-pill severity-' + riskSeverityClass(area.level) + '">Level: ' + esc(area.level) + '</span></div>';
      html += '</div>';
      html += '<div class="finding-text"><p>' + esc(area.summary || '') + '</p></div>';
      if (area.findings && area.findings.length > 0) {
        html += '<div class="finding-block"><h3>Evidence</h3>';
        html += '<ul>' + area.findings.map(finding => '<li>' + esc(finding.title) + '</li>').join('') + '</ul>';
        html += '</div>';
      }
      html += '</article>';
    });
    html += '</div>';
    return html;
  }

  function sortedRiskAreas(riskAreas) {
    return [...(riskAreas || [])].sort((a, b) => riskLevelWeight(b.level) - riskLevelWeight(a.level));
  }

  function riskLevelWeight(level) {
    switch (level || 'LOW') {
      case 'CRITICAL': return 4;
      case 'HIGH': return 3;
      case 'MEDIUM': return 2;
      default: return 1;
    }
  }

  function riskSeverityClass(level) {
    switch (level || 'LOW') {
      case 'CRITICAL': return 'CRITICAL';
      case 'HIGH': return 'HIGH';
      case 'MEDIUM': return 'MEDIUM';
      default: return 'LOW';
    }
  }

  function sortedFindings(findings) {
    return [...(findings || [])].sort((a, b) => getPriorityScore(b) - getPriorityScore(a));
  }

  function getPriorityScore(finding) {
    if (finding && typeof finding.priority === 'number') {
      return finding.priority;
    }
    if (finding && finding.priority && typeof finding.priority.score === 'number') {
      return finding.priority.score;
    }
    return Math.floor(severityWeight(finding && finding.severity) * confidenceMultiplier(finding && finding.confidence));
  }

  function severityWeight(severity) {
    switch (severity || 'INFO') {
      case 'CRITICAL': return 100;
      case 'HIGH': return 75;
      case 'MEDIUM': return 50;
      case 'LOW': return 25;
      default: return 10;
    }
  }

  function confidenceMultiplier(confidence) {
    switch (confidence || 'POSSIBLE') {
      case 'CONFIRMED': return 1.0;
      case 'LIKELY': return 0.8;
      default: return 0.5;
    }
  }

  function toTitle(value) {
    return String(value || '')
      .toLowerCase()
      .replace(/_/g, ' ')
      .replace(/\b\w/g, c => c.toUpperCase());
  }

  function mergeFindings(rawFindings, aiFindings) {
    const merged = [];
    const seen = new Set();
    [...(rawFindings || []), ...(aiFindings || [])].forEach(finding => {
      const key = (finding.title || '').toLowerCase();
      if (!key || seen.has(key)) return;
      seen.add(key);
      merged.push(finding);
    });
    return merged;
  }

  function esc(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function renderReport(data) {
    const ai = data.aiReport;
    const raw = data.rawAnalysis;
    const score = ai.architectureScore;
    const circumference = 2 * Math.PI * 52;
    const offset = circumference - (score / 10) * circumference;
    const color = scoreColor(score);

    let html = '';

    const evidenceFindings = mergeFindings(raw && raw.evidenceBasedFindings, ai.findings);
    const architecturalFindings = raw && raw.mergedFindings && raw.mergedFindings.length > 0
      ? raw.mergedFindings
      : evidenceFindings;
    const topArchitecturalFindings = sortedFindings(architecturalFindings).slice(0, 5);

    // Score
    html += '<div class="card"><div class="score-hero">';
    html += '<div class="score-circle">';
    html += '<svg width="120" height="120" viewBox="0 0 120 120">';
    html += '<circle class="score-circle-bg" cx="60" cy="60" r="52"/>';
    html += '<circle class="score-circle-fg" cx="60" cy="60" r="52" stroke="' + color + '" stroke-dasharray="' + circumference + '" stroke-dashoffset="' + offset + '"/>';
    html += '</svg>';
    html += '<div class="score-number">' + score + '<span>/10</span></div>';
    html += '</div>';
    html += '<div class="assessment-text">Architecture score generated from AI review and deterministic analyzer signals.</div>';
    html += '</div></div>';

    // Executive summary
    html += '<div class="card"><h2>Executive Summary</h2>' + renderExecutiveSummary(raw, architecturalFindings) + '</div>';

    // Architecture style
    html += '<div class="card"><h2>Detected Architecture Style</h2>' + renderArchitectureStyle(raw) + '</div>';

    // Risk areas
    html += '<div class="card"><h2>Risk Areas</h2>' + renderRiskAreas(raw && raw.riskAreas) + '</div>';

    // Category scores
    html += '<div class="card"><h2>Category Scores</h2><div class="category-grid">';
    if (ai.categoryScores) {
      for (const [key, val] of Object.entries(ai.categoryScores)) {
        const c = scoreColor(val);
        html += '<div class="category-item">';
        html += '<div class="category-label">' + esc(key) + '</div>';
        html += '<div class="category-bar-track"><div class="category-bar-fill" style="width:' + (val * 10) + '%;background:' + c + '"></div></div>';
        html += '<div class="category-value" style="color:' + c + '">' + val + '/10</div>';
        html += '</div>';
      }
    }
    html += '</div></div>';

    // Architecture summary
    if (raw && raw.summary) {
      const s = raw.summary;
      const stats = [
        ['Controllers', s.controllers], ['Services', s.services], ['Repositories', s.repositories],
        ['Components', s.components], ['Configurations', s.configurations], ['Entities', s.entities]
      ].filter(x => x[1] > 0);
      html += '<div class="card"><h2>Architecture Summary</h2><div class="summary-grid">';
      stats.forEach(([label, num]) => {
        html += '<div class="summary-stat"><div class="num">' + num + '</div><div class="label">' + label + '</div></div>';
      });
      html += '</div></div>';
    }

    // Top architectural findings
    html += '<div class="card"><h2>Top Architectural Findings</h2>' + renderFindings(topArchitecturalFindings);
    if (raw && raw.evidenceBasedFindings && raw.evidenceBasedFindings.length > 0) {
      html += '<details class="legacy-observations"><summary>Show analyzer evidence details</summary>';
      html += renderFindingsByCategory(raw.evidenceBasedFindings);
      html += '</details>';
    }
    if (ai.observationAnalysis && ai.observationAnalysis.length > 0) {
      html += '<details class="legacy-observations"><summary>Show raw observations</summary>';
      html += '<ul class="item-list neutral">' + ai.observationAnalysis.map(i => '<li>' + esc(i) + '</li>').join('') + '</ul>';
      html += '</details>';
    }
    html += '</div>';

    // Recommended refactorings
    html += '<div class="card"><h2>Recommended Refactorings</h2>' + renderRecommendedRefactorings(architecturalFindings, ai.improvements) + '</div>';

    // Coupling ranking
    if (raw && raw.couplingRanking && raw.couplingRanking.length > 0) {
      html += '<div class="card"><h2>Coupling Ranking</h2>';
      raw.couplingRanking.forEach((item, i) => {
        html += '<div class="coupling-item"><div class="coupling-rank">' + (i + 1) + '</div><div class="coupling-text">' + esc(item) + '</div></div>';
      });
      html += '</div>';
    }

    // Endpoints
    if (raw && raw.endpoints && raw.endpoints.length > 0) {
      html += '<div class="card"><h2>REST Endpoints</h2>';
      html += '<table class="data-table"><thead><tr><th>Method</th><th>Path</th><th>Controller</th><th>Handler</th></tr></thead><tbody>';
      raw.endpoints.forEach(ep => {
        html += '<tr>';
        html += '<td><span class="method-badge method-' + esc(ep.httpMethod) + '">' + esc(ep.httpMethod) + '</span></td>';
        html += '<td class="mono">' + esc(ep.endpointPath) + '</td>';
        html += '<td>' + esc(ep.controllerName) + '</td>';
        html += '<td class="mono">' + esc(ep.methodName) + '()</td>';
        html += '</tr>';
      });
      html += '</tbody></table></div>';
    }

    // Packages
    if (raw && raw.packages && raw.packages.length > 0) {
      html += '<div class="card"><h2>Package Breakdown</h2>';
      raw.packages.forEach(pkg => {
        html += '<div class="package-item">';
        html += '<span class="package-name">' + esc(pkg.packageName) + '</span>';
        html += '<div class="package-badges">';
        html += '<span class="badge">' + pkg.classCount + ' classes</span>';
        if (pkg.componentTypeDistribution) {
          for (const [type, count] of Object.entries(pkg.componentTypeDistribution)) {
            if (type !== 'UNKNOWN') html += '<span class="badge">' + count + ' ' + esc(type.toLowerCase().replace('_', ' ')) + '</span>';
          }
        }
        html += '</div></div>';
      });
      html += '</div>';
    }

    // Mermaid diagram
    if (data.mermaidDiagram) {
      html += '<div class="card"><h2>Architecture Diagram</h2><div class="mermaid-container"><pre class="mermaid">' + esc(data.mermaidDiagram) + '</pre></div></div>';
    }

    $('report').innerHTML = html;
    $('report').className = 'active';

    mermaid.run({ nodes: document.querySelectorAll('.mermaid') });
  }
</script>

</body>
</html>
