apiVersion: v1
kind: Secret
metadata:
  name: analyzer-secret
type: Opaque
data:
  OPENAI_API_KEY: Y2hhbmdlLW1l  # base64 encoded "change-me"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analyzer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analyzer
  template:
    metadata:
      labels:
        app: analyzer
    spec:
      containers:
        - name: analyzer
          image: ai-codebase-analyzer:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: analyzer-secret
                  key: OPENAI_API_KEY
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              value: "http://keycloak:8080/realms/codebase-analyzer"

---
apiVersion: v1
kind: Service
metadata:
  name: analyzer
spec:
  selector:
    app: analyzer
  ports:
    - port: 8080
      targetPort: 8080
